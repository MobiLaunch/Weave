name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk weave.apk

      - uses: actions/upload-artifact@v4
        with:
          name: weave-debug-apk
          path: weave.apk

      # Every push to main publishes a release, so the phone can grab the APK from
      # https://github.com/MobiLaunch/Weave/releases/latest/download/weave.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" weave.apk \
            --title "Weave build ${{ github.run_number }}" \
            --notes "Debug build of ${GITHUB_SHA::7}. On your phone, download weave.apk and open it to install." \
            --latest
